<script>
'use strict';
const GIS_URL=new URL('gis/master.geojson',document.baseURI).href;
const AI_DATA_URL='https://docs.google.com/spreadsheets/d/1SJU9aCRZGWeAeHw6UfY_08HK8-A34kIlnrEiPJNEnko/gviz/tq?tqx=out:csv&gid=1866404435&tq=select%20*';
const HOME=[15.75,108.30], HOME_ZOOM=9;
const map=L.map('map',{preferCanvas:true,zoomControl:true}).setView(HOME,HOME_ZOOM);
const bases={
 satellite:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}),
 street:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'}),
 dark:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'})
};
bases.satellite.addTo(map);
const dataLayer=L.layerGroup().addTo(map), pointLayer=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:48,showCoverageOnHover:false}), lineLayer=L.geoJSON(null,{style:styleLine,onEachFeature:onLineFeature});
dataLayer.addLayer(pointLayer);dataLayer.addLayer(lineLayer);
let geojson=null,index=[],markerByFeature=new WeakMap(),liveRows=null,liveLoadedAt=0,liveInflight=null,selectedAlert='all',alertData=[],activePopupRefresh=null;
const $=id=>document.getElementById(id), status=$('status');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function norm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/đ/g,'d').replace(/\s+/g,' ').trim();}
function nameOf(f){const p=f?.properties||{};return p.name||p.Name||p.NAME||p.ten||p.Ten||p.TEN||p.ten_kenh||p.TEN_KENH||'Đối tượng thủy lợi';}
function descOf(f){const p=f?.properties||{};return p.description||p.Description||p.DESCRIPTION||p.mo_ta||p.MoTa||'';}
function typeOf(f){const p=f?.properties||{},text=norm([p.name,p.Name,p.NAME,p.description,p.Description].filter(Boolean).join(' ')),g=f?.geometry?.type||'';if(text.includes('cong ')||text.includes('cong tuoi')||text.includes('cong tieu'))return'cong';if(text.includes('tram bom')||text.includes('tb '))return'tram_bom';if(text.includes('ho chua')||text.startsWith('ho ')||text.includes(' ho '))return'ho';if(text.includes('dap ')||text.startsWith('dap'))return'dap';if(text.includes('kenh')||text.includes('kenh chinh')||text.includes('kenh nhanh'))return'kenh';if(text.includes('khu tuoi'))return'khu_tuoi';if(text.includes('tran '))return'tran';if(text.includes('cau '))return'cau';if(g==='LineString'||g==='MultiLineString')return'kenh';return'khac';}
const labels={ho:'HỒ CHỨA',tram_bom:'TRẠM BƠM',dap:'ĐẬP',cong:'CỐNG',kenh:'KÊNH',khu_tuoi:'KHU TƯỚI',tran:'TRÀN',cau:'CẦU',khac:'CÔNG TRÌNH'};
function icon(type){const c={ho:['💧','#1683ff'],tram_bom:['⚙','#1677ff'],dap:['▥','#f97316'],cong:['▣','#8e44ad']}[type]||['●','#64748b'];return L.divIcon({className:'',html:`<div class="thuy-pin" style="--pin-color:${c[1]}"><div class="thuy-pin-icon">${c[0]}</div><div class="thuy-pin-tail"></div></div>`,iconSize:[34,40],iconAnchor:[17,39],popupAnchor:[0,-38]});}
function styleLine(f){const p=f?.properties||{},c=p.KMLColor||p.kmlColor||p.color||'#1677ff',w=Number(p.KMLWidth||p.kmlWidth||p.width)||2;return{color:c,weight:w,opacity:map.getZoom()>=11?.78:.35,fillColor:p.KMLPolyColor||c,fillOpacity:f?.geometry?.type?.includes('Polygon')?.08:0};}
function onLineFeature(f,l){l.bindTooltip(`<b>${esc(nameOf(f))}</b>`,{sticky:true,direction:'top',opacity:.9});l.on('click',e=>{l.setStyle({weight:Math.max(Number(f?.properties?.KMLWidth)||2,2)+2,opacity:1});l.openTooltip(e.latlng);setTimeout(()=>lineLayer.resetStyle(l),1800);});}
function propsHtml(p){const candidates=[['Mã',p.code||p.Code||p.CODE||p.id],['MNDBT',p.MNDBT||p.mndbt||p.MucNuocDBT],['MNDGC',p.MNDGC||p.mndgc||p.MucNuocDGC],['Dung tích',p.dung_tich||p.DungTich||p.dungTich],['Công suất',p.cong_suat||p.CongSuat||p.congSuat],['Lưu lượng',p.luu_luong||p.LuuLuong||p.luuLuong],['Diện tích',p.dien_tich||p.DienTich||p.dientich]];return candidates.filter(x=>x[1]!=null&&String(x[1]).trim()!=='').map(x=>`<div class="prop"><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('');}
function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++;}else q=!q;}else if(c===','&&!q){row.push(cell);cell='';}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>String(x).trim()!==''))rows.push(row);row=[];}else cell+=c;}if(cell!==''||row.length){row.push(cell);if(row.some(x=>String(x).trim()!==''))rows.push(row);}if(!rows.length)return[];const h=rows[0].map(x=>String(x).trim());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]??''])));}
const fields={facility:['cong trinh','congtrinh','ten cong trinh','tencongtrinh','tram','ho','ten ho','facility','name','ten'],code:['ma cong trinh','macongtrinh','ma','code','id'],time:['thoi gian','thoigian','datetime','date time','timestamp','time','ngay gio','ngaygio','date'],water:['muc nuoc','mucnuoc','muc nuoc ho','water level','waterlevel','z','muc nuoc ht','muc nuoc hien tai'],flow:['luu luong','luuluong','q','flow','discharge'],rain:['luong mua','luongmua','mua','rainfall','rain','precipitation'],sal:['do man','doman','salinity','man'],mndbt:['mndbt','muc nuoc dbt','mucnuocdbt'],mndgc:['mndgc','muc nuoc dgc','mucnuocdgc']};
function field(r,a){const w=a.map(norm);for(const [k,v] of Object.entries(r||{})){const nk=norm(k);if(w.includes(nk)&&String(v).trim()!=='')return v;}for(const [k,v] of Object.entries(r||{})){const nk=norm(k);if(w.some(x=>nk.includes(x)||x.includes(nk))&&String(v).trim()!=='')return v;}return null;}
function num(v){if(v==null||v==='')return null;const n=Number(String(v).replace(',','.').replace(/[^0-9+\-.]/g,''));return Number.isFinite(n)?n:null;}
function dateOf(v){if(!v)return null;const d=new Date(v);if(!isNaN(d))return d;const m=String(v).match(/(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);return m?new Date(+m[3],+m[2]-1,+m[1],+(m[4]||0),+(m[5]||0),+(m[6]||0)):null;}
async function loadAI(force=false){const now=Date.now();if(!force&&liveRows&&now-liveLoadedAt<60000)return liveRows;if(liveInflight)return liveInflight;liveInflight=fetch(AI_DATA_URL+'&_ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('AI_DATA HTTP '+r.status);return r.text();}).then(t=>{const rows=parseCSV(t);if(!rows.length)throw Error('AI_DATA không có dữ liệu');liveRows=rows;liveLoadedAt=Date.now();try{sessionStorage.setItem('TL_MAP_LAST_AI_DATA',JSON.stringify({t:Date.now(),rows}))}catch(e){}return rows;}).catch(e=>{if(liveRows)return liveRows;try{const s=JSON.parse(sessionStorage.getItem('TL_MAP_LAST_AI_DATA')||'null');if(s?.rows?.length){liveRows=s.rows;liveLoadedAt=Number(s.t)||0;return liveRows;}}catch(_){}throw e;}).finally(()=>liveInflight=null);return liveInflight;}
function matchedRows(rows,name){const n=norm(name);return rows.filter(r=>{const rn=norm(field(r,fields.facility));return rn&&(rn===n||rn.includes(n)||n.includes(rn));});}
function latestRow(rows){return [...rows].sort((a,b)=>(dateOf(field(b,fields.time))?.getTime()||0)-(dateOf(field(a,fields.time))?.getTime()||0))[0]||rows[0];}
function timeLabel(v){const d=dateOf(v);return d?d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):String(v||'');}
function livePayload(name){return loadAI(true).then(rows=>{const m=matchedRows(rows,name);if(!m.length)throw Error('Chưa có số liệu cho công trình này trong AI_DATA.');const r=latestRow(m);return{row:r,rows:m,water:num(field(r,fields.water)),flow:num(field(r,fields.flow)),rain:num(field(r,fields.rain)),sal:num(field(r,fields.sal)),mndbt:num(field(r,fields.mndbt)),mndgc:num(field(r,fields.mndgc)),time:field(r,fields.time)}});}
function spark(rows){const pts=rows.map(r=>({d:dateOf(field(r,fields.time)),v:num(field(r,fields.water))})).filter(x=>x.d&&x.v!=null).sort((a,b)=>a.d-b.d).slice(-24);if(pts.length<2)return'';const min=Math.min(...pts.map(x=>x.v)),max=Math.max(...pts.map(x=>x.v)),range=Math.max(max-min,.001),w=260,h=64;const p=pts.map((x,i)=>`${(i/(pts.length-1))*(w-8)+4},${h-6-((x.v-min)/range)*(h-14)}`).join(' ');return`<div class="chart"><svg viewBox="0 0 ${w} ${h}" width="100%" height="64" preserveAspectRatio="none"><polyline points="${p}" fill="none" stroke="#1677ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;}
function popup(f,l){const p=f.properties||{},name=nameOf(f),type=typeOf(f),latlng=l.getLatLng();const popup=document.createElement('div');popup.className='popup';popup.innerHTML=`<div class="popup-head"><div class="popup-title">${esc(name)}</div><div class="popup-type">${labels[type]||'CÔNG TRÌNH'} • LIVE AI_DATA</div></div><div class="live"><div class="loading">⏳ Đang đọc số liệu…</div></div>${propsHtml(p)?`<div class="props">${propsHtml(p)}</div>`:''}`;l.bindPopup(popup,{maxWidth:360,minWidth:250});const card=popup.querySelector('.live');const refresh=()=>livePayload(name).then(x=>{const water=x.water!=null?x.water.toFixed(2)+' m':'—',flow=x.flow!=null?x.flow.toFixed(2)+' m³/s':'—',rain=x.rain!=null?x.rain.toFixed(2)+' mm':'—',sal=x.sal!=null?x.sal.toFixed(2)+' ‰':'—';card.innerHTML=`<div class="live-head"><b>QUAN TRẮC THỰC TẾ</b><span>● LIVE</span></div><div class="live-main">${water}</div><div class="live-grid"><div class="live-item"><div class="live-label">💧 Lưu lượng</div><div class="live-value">${flow}</div></div><div class="live-item"><div class="live-label">🌧️ Lượng mưa</div><div class="live-value">${rain}</div></div><div class="live-item"><div class="live-label">🧂 Độ mặn</div><div class="live-value">${sal}</div></div><div class="live-item"><div class="live-label">MNDBT</div><div class="live-value">${x.mndbt!=null?x.mndbt.toFixed(2)+' m':'—'}</div></div></div>${spark(x.rows)}<div class="live-note">Cập nhật: ${esc(timeLabel(x.time))}</div><button class="live-refresh">↻ Cập nhật ngay</button>`;card.querySelector('.live-refresh').onclick=refresh;}).catch(e=>{card.innerHTML=`<div class="error">⚠️ ${esc(e.message)}</div><button class="live-refresh">↻ Thử lại</button>`;card.querySelector('.live-refresh').onclick=refresh;});l.on('popupopen',()=>{activePopupRefresh=refresh;refresh();});l.on('popupclose',()=>{if(activePopupRefresh===refresh)activePopupRefresh=null;});}
function buildIndex(){index=geojson.features.map((f,i)=>({f,i,name:nameOf(f),type:typeOf(f),text:norm(nameOf(f)+' '+descOf(f))}));}
function zoomRecord(r){const f=r.f,marker=markerByFeature.get(f);if(marker){pointLayer.zoomToShowLayer(marker,()=>{marker.openPopup();});}else{const c=f.geometry?.coordinates;if(f.geometry?.type==='Point'&&c)map.setView([c[1],c[0]],15,{animate:true});else{const layer=lineLayer.getLayers().find(x=>x.feature===f);if(layer){map.fitBounds(layer.getBounds(),{padding:[30,30]});layer.openTooltip();}}}}
function search(q){const n=norm(q);if(!n){$('searchResults').style.display='none';return;}const results=index.filter(r=>r.text.includes(n)).slice(0,30);const box=$('searchResults');if(!results.length){box.innerHTML='<div style="padding:14px;color:#64748b">Không tìm thấy đối tượng.</div>';box.style.display='block';return;}box.innerHTML=results.map((r,i)=>`<button data-i="${i}"><div class="result-name">${esc(r.name)}</div><div class="result-type">${labels[r.type]||'CÔNG TRÌNH'}</div></button>`).join('');box.style.display='block';box.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{box.style.display='none';zoomRecord(results[i]);});}
function alertType(z,b,g){if(z==null)return null;if(g!=null&&z>=g)return'above_g';if(g!=null&&z<g&&g-z<=.5)return'near_g';if(b!=null&&z>=b)return'above_b';if(b!=null&&z<b&&b-z<=.5)return'near_b';return null;}
const alertDefs={above_g:['Trên MNDGC','#dc2626'],near_g:['Gần MNDGC','#ea580c'],above_b:['Trên MNDBT','#f59e0b'],near_b:['Gần MNDBT','#2563eb']};
async function refreshAlerts(){try{const rows=await loadAI(true),out=[];for(const r of index.filter(x=>x.type==='ho')){const m=matchedRows(rows,r.name);const lr=latestRow(m);if(!lr)continue;const z=num(field(lr,fields.water)),b=num(field(lr,fields.mndbt))??num(r.f.properties?.MNDBT),g=num(field(lr,fields.mndgc))??num(r.f.properties?.MNDGC),kind=alertType(z,b,g);if(kind)out.push({r,z,b,g,kind,t:field(lr,fields.time)});}alertData=out;renderAlerts();}catch(e){$('alertBadge').textContent='!';status.textContent='⚠ Không cập nhật được AI_DATA';}}
function renderAlerts(){const counts={above_g:0,near_g:0,above_b:0,near_b:0};alertData.forEach(x=>counts[x.kind]++);const total=alertData.length;$('alertBadge').textContent=total>99?'99+':total;$('alertBtn').classList.toggle('active',total>0);$('alertSummary').innerHTML=Object.entries(alertDefs).map(([k,v])=>`<button data-group="${k}" style="border-color:${v[1]}33"><b style="color:${v[1]}">${counts[k]}</b><span>${v[0]}</span></button>`).join('');$('alertSummary').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{selectedAlert=b.dataset.group;renderAlertList();});renderAlertList();}
function renderAlertList(){const list=selectedAlert==='all'?alertData:alertData.filter(x=>x.kind===selectedAlert);$('alertList').innerHTML=list.length?list.map((x,i)=>{const d=alertDefs[x.kind];const diff=(x.z-(x.kind.includes('_g')?x.g:x.b));return`<button class="alert-row" data-i="${i}"><span class="alert-icon" style="color:${d[1]}">▲</span><span><span class="alert-name">${esc(x.r.name)}</span><span class="alert-meta">Z ${x.z?.toFixed(2)||'—'} m · MNDBT ${x.b?.toFixed(2)||'—'} · MNDGC ${x.g?.toFixed(2)||'—'}</span></span><span class="alert-diff" style="color:${d[1]}">${diff>=0?'+':''}${diff.toFixed(2)} m</span></button>`;}).join(''):'<div style="padding:14px;color:#64748b;font-size:11px">Không có hồ trong nhóm này.</div>';$('alertList').querySelectorAll('[data-i]').forEach((b,i)=>b.onclick=()=>{const list2=selectedAlert==='all'?alertData:alertData.filter(x=>x.kind===selectedAlert);zoomRecord(list2[i].r);$('alertSheet').classList.remove('open');});}
async function loadGIS(){try{status.textContent='Đang tải dữ liệu GIS…';const r=await fetch(GIS_URL,{cache:'default'});if(!r.ok)throw Error('GIS HTTP '+r.status);geojson=await r.json();if(!Array.isArray(geojson.features))throw Error('GeoJSON không hợp lệ');const points=geojson.features.filter(f=>['Point','MultiPoint'].includes(f.geometry?.type)&&['ho','tram_bom','dap'].includes(typeOf(f)));const lines=geojson.features.filter(f=>f.geometry&& !['Point','MultiPoint'].includes(f.geometry.type));lineLayer.addData(lines);const markers=points.map(f=>{const c=f.geometry.coordinates;if(!Array.isArray(c)||c.length<2)return null;const m=L.marker([c[1],c[0]],{icon:icon(typeOf(f)),riseOnHover:true});m.feature=f;markerByFeature.set(f,m);m.on('click',()=>popup(f,m));return m;}).filter(Boolean);pointLayer.addLayers(markers);buildIndex();status.textContent=`● GIS LIVE • ${geojson.features.length.toLocaleString('vi-VN')} đối tượng`;setTimeout(()=>refreshAlerts(),900);setInterval(()=>{refreshAlerts();if(document.visibilityState==='visible'&&activePopupRefresh)activePopupRefresh();},120000);setInterval(()=>{if(document.visibilityState==='visible'&&activePopupRefresh)activePopupRefresh();},60000);}catch(e){console.error(e);status.textContent='❌ Không tải được dữ liệu GIS';}}
map.on('zoomend',()=>lineLayer.eachLayer(l=>l.setStyle(styleLine(l.feature))));
$('search').addEventListener('input',e=>search(e.target.value));$('searchBtn').onclick=()=>search($('search').value);$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search(e.target.value);if(e.key==='Escape')$('searchResults').style.display='none';});
$('layerBtn').onclick=()=>{$('layerPanel').classList.toggle('open');$('alertSheet').classList.remove('open');};$('layerClose').onclick=()=>$('layerPanel').classList.remove('open');$('alertBtn').onclick=()=>{$('alertSheet').classList.toggle('open');$('layerPanel').classList.remove('open');if($('alertSheet').classList.contains('open'))refreshAlerts();};$('alertClose').onclick=()=>$('alertSheet').classList.remove('open');
document.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-base]').forEach(x=>x.classList.remove('active'));b.classList.add('active');Object.values(bases).forEach(x=>map.removeLayer(x));bases[b.dataset.base].addTo(map);});
$('facilities').onchange=e=>e.target.checked?dataLayer.addLayer(pointLayer):dataLayer.removeLayer(pointLayer);$('channels').onchange=e=>e.target.checked?dataLayer.addLayer(lineLayer):dataLayer.removeLayer(lineLayer);$('homeBtn').onclick=()=>map.setView(HOME,HOME_ZOOM,{animate:true});$('gpsBtn').onclick=()=>map.locate({setView:true,maxZoom:15,enableHighAccuracy:true});map.on('locationerror',()=>status.textContent='⚠ Không lấy được vị trí GPS');map.on('locationfound',e=>status.textContent=`📍 Vị trí ±${Math.round(e.accuracy)} m`);
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap')&&!e.target.closest('.search-results'))$('searchResults').style.display='none';});
loadGIS();
</script>
