<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="THỦY LỢI AI">
  <meta name="theme-color" content="#082a4a">
  <title>BẢN ĐỒ THỦY LỢI | VU GIA – THU BỒN</title>

  <!-- RESOURCE HINTS -->
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://thuyloiai.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://thuyloiai.onrender.com">
  <link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
  <link rel="dns-prefetch" href="https://api.open-meteo.com">

  <!-- PRELOAD STYLES -->
  <link rel="preload" as="style" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></noscript>

  <link rel="preload" as="style" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"></noscript>
  <link rel="preload" as="style" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"></noscript>

  <style id="map-only-cleanup">
    html, body { width:100%; height:100%; margin:0; padding:0; overflow:hidden !important; background:#eef3f7; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    body > header.header,
    body > main > .card.chat,
    body > main > .footer,
    body > main > .field-report-entry,
    #fieldReportPanel, #technicalModuleContainer, #reportEditor, #pdfActions, #pdfStatus, #pdfResult, #imagePreview,
    .ai-action-buttons, .compose, .suggestions, .quick-title, .quick, .hero, .info { display:none !important; }

    body > main { width:100% !important; max-width:none !important; margin:0 !important; padding:0 !important; }
    #mapAiPanel.map-ai-panel { display:flex !important; position:fixed !important; inset:0 !important; width:100vw !important; height:100dvh !important; max-width:none !important; margin:0 !important; z-index:9999 !important; background:#fff !important; overflow:hidden !important; }
    #mapAiPanel .map-container { flex:1 1 auto; min-height:0 !important; height:auto !important; position:relative; }
    #mapAiPanel #aiMap { height:100% !important; width:100% !important; min-height:0 !important; }
    #mapAiPanel .map-ai-status { display:none !important; }
    #mapAiPanel #closeMapAi { display:none !important; }
  </style>

  <style id="map-mobile-alignment-v7">
    @media (max-width:600px){
      #mapAiPanel #closeMapAi{
        position:fixed!important;
        top:max(64px,calc(env(safe-area-inset-top) + 62px))!important;
        left:8px!important;
        width:44px!important;
        min-width:44px!important;
        height:50px!important;
        padding:0!important;
        margin:0!important;
        border-radius:15px!important;
        z-index:5002!important;
        display:flex!important;
        align-items:center!important;
        justify-content:center!important;
        box-sizing:border-box!important;
      }

      #mapAiPanel #closeMapAi::after{
        content:"←"!important;
        font-size:24px!important;
        line-height:1!important;
        font-weight:400!important;
      }

      #mapAiPanel #closeMapAi span{ display:none!important; }

      #mapAiPanel .map-search-wrap{
        position:fixed!important;
        top:max(64px,calc(env(safe-area-inset-top) + 62px))!important;
        left:58px!important;
        right:8px!important;
        width:auto!important;
        transform:none!important;
        box-sizing:border-box!important;
        z-index:5001!important;
      }

      #mapAiPanel.map-ai-panel>.map-search-wrap .map-search-box{
        width:100%!important;
        height:50px!important;
        min-height:50px!important;
        border-radius:15px!important;
        display:flex!important;
        align-items:center!important;
        background:#fff!important;
        padding:0 10px!important;
        border:1px solid #d8e1eb!important;
      }

      #mapAiPanel .map-quick-chips{
        position:fixed!important;
        top:calc(max(64px,calc(env(safe-area-inset-top) + 62px)) + 57px)!important;
        left:8px!important;
        right:8px!important;
        width:auto!important;
        transform:none!important;
        overflow-x:auto!important;
        display:flex!important;
        gap:6px!important;
        z-index:5000!important;
        white-space:nowrap!important;
      }
    }
  </style>
</head>
<body>

  <main>
    <div id="mapAiPanel" class="map-ai-panel">
      <div class="map-ai-header">
        <strong>BẢN ĐỒ HỆ THỐNG THỦY LỢI VU GIA – THU BỒN</strong>
        <button id="closeMapAi"><span>Đóng</span></button>
      </div>

      <div class="map-search-wrap">
        <div class="map-search-box">
          <span class="map-search-icon">🔍</span>
          <input type="text" id="mapSearchInput" placeholder="Tìm kiếm công trình, hồ chứa, trắc đạc..." />
          <button id="mapLocateBtn" title="Vị trí của tôi">🎯</button>
        </div>
        <div id="searchResults"></div>
      </div>

      <div class="map-container">
        <div id="aiMap"></div>
      </div>
    </div>
  </main>

  <!-- SCRIPTS LAZY LOADING -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      // Khởi tạo bản đồ Leaflet
      var map = L.map('aiMap').setView([15.88, 108.00], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Sửa lỗi hiển thị kích thước tile khi chạy trên mobile / full screen
      setTimeout(function() {
        map.invalidateSize();
      }, 300);
    });
  </script>
</body>
</html>
